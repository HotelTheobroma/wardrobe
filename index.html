    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F4EFE6; --bg-card: #FFFFFF; --text-main: #3E2723; --text-sub: #795548;
            --color-green: #9CAF88; --color-green-hover: #8A9F76;
            --color-orange: #D99C5B; --color-orange-hover: #C88A4A;
            --color-clay: #BFA38A; --color-clay-hover: #A88D75;
            --border-color: #E2D7C8;
        }

        body { font-family: 'Gowun Dodum', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        body.busy { cursor: progress; }
        body.busy button { pointer-events: none; opacity: 0.7; }

        .container { background: var(--bg-card); padding: 40px 50px; border-radius: 8px; box-shadow: 0 4px 20px rgba(62, 39, 35, 0.06); width: 100%; max-width: 1200px; box-sizing: border-box; border: 1px solid var(--border-color); }

        h1 { font-size: 24px; color: var(--text-main); margin: 0 0 30px 0; padding-bottom: 12px; border-bottom: 2px solid var(--text-main); font-weight: normal; }

        .login-wrapper { text-align: center; padding: 60px 0; }
        .login-desc { font-size: 16px; color: var(--text-sub); margin-bottom: 25px; }

        input[type="password"], input[type="text"], textarea { padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 4px; font-family: inherit; font-size: 15px; outline: none; color: var(--text-main); background-color: #FFF; box-sizing: border-box; }
        input[type="password"] { text-align: center; width: 240px; background-color: var(--bg-body); }

        button { font-family: inherit; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; transition: all 0.2s ease; padding: 10px 18px; }
        .btn-login { background-color: var(--text-main); color: #FFF; margin-left: 10px; padding: 12px 24px; font-size: 15px; }
        .btn-login:hover { background-color: #2D1C19; }

        .usage-notice { font-size: 13px; color: #9CAF88; margin-top: 30px; letter-spacing: -0.3px; }

        #main-screen { display: none; }

        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 20px; gap: 10px; flex-wrap: wrap; }
        .account-box { display: flex; align-items: center; gap: 15px; }
        .btn-inbox { background: none; padding: 6px 12px; font-size: 20px; color: var(--text-sub); border-radius: 4px; border: 1px solid var(--border-color); position: relative; }
        .btn-inbox:hover { background-color: #FFF; color: var(--text-main); }
        .inbox-badge { position: absolute; top: -6px; right: -6px; background: var(--color-orange); color: #FFF; font-size: 11px; border-radius: 9px; min-width: 18px; height: 18px; line-height: 18px; padding: 0 4px; box-sizing: border-box; display: none; }
        .coin-display { font-weight: bold; color: var(--color-orange); font-size: 22px; }

        .layout-grid { display: flex; gap: 50px; align-items: flex-start; }
        .canvas-section { display: flex; flex-direction: column; gap: 15px; }

        .canvas-container { position: relative; background: var(--bg-body); padding: 15px; border: 1px solid var(--border-color); width: 380px; max-width: 100%; box-sizing: border-box; overflow: hidden; }
        canvas { background-color: #FFFFFF; width: 100%; height: auto; display: block; border: 1px solid #E2D7C8; }

        #effect-clip { position: absolute; overflow: hidden; z-index: 10; pointer-events: none; display: none; }
        #effect-overlay { position: absolute; left: 0; top: 0; max-width: none; cursor: grab; pointer-events: auto; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; touch-action: none; }
        #effect-overlay:active { cursor: grabbing; }

        .shop-section { flex: 1; min-width: 0; }
        .tab-menu { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; gap: 5px; padding-bottom: 5px; }
        .tab-btn { background: none; border: none; padding: 12px 20px; font-size: 16px; color: var(--text-sub); border-bottom: 3px solid transparent; border-radius: 0; }
        .tab-btn.active { color: var(--text-main); font-weight: bold; border-bottom: 3px solid var(--text-main); }

        .shop-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; height: 520px; min-height: 520px; overflow-y: auto; padding-right: 15px; align-content: start; box-sizing: border-box; }
        .shop-list::-webkit-scrollbar { width: 8px; }
        .shop-list::-webkit-scrollbar-thumb { background-color: #D3C9BC; border-radius: 4px; }

        .section-divider { grid-column: 1 / -1; font-weight: bold; color: var(--text-main); padding: 15px 5px 5px 5px; border-bottom: 1px dashed var(--border-color); margin-top: 15px; font-size: 16px; }
        .section-divider:first-child { margin-top: 0; }

        .item-card { background: #FFFFFF; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 195px; box-sizing: border-box; }
        .item-preview { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; }
        .preview-none { background:#F4EFE6; border:1px dashed #CCC; box-sizing:border-box; display:flex; justify-content:center; align-items:center; color:#999; font-size:14px; font-weight:bold; }
        .item-name { font-size: 14px; margin-bottom: 10px; color: var(--text-main); text-align: center; word-break: keep-all; line-height: 1.3; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .card-actions { display: flex; gap: 4px; width: 100%; }
        .btn-buy { background-color: var(--color-orange); color: #FFF; flex: 1; font-size: 13px; padding: 8px 0; }
        .btn-buy:hover { background-color: var(--color-orange-hover); }
        .btn-equip { background-color: var(--color-green); color: #FFF; flex: 1; font-size: 13px; padding: 8px 0; }
        .btn-equip:hover { background-color: var(--color-green-hover); }
        .btn-gift-trigger { background-color: var(--color-clay); color: #FFF; padding: 8px 10px; font-size: 13px; }
        .btn-gift-trigger:hover { background-color: var(--color-clay-hover); }

        .btn-save { background-color: var(--text-main); color: #FFF; width: 100%; padding: 14px; font-size: 16px; border-radius: 6px; }
        .btn-save:hover { background-color: #2D1C19; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(45, 28, 25, 0.4); justify-content: center; align-items: center; z-index: 1000; padding: 16px; box-sizing: border-box; }
        .modal-box { background: #FFF; padding: 35px; border-radius: 8px; border: 1px solid var(--border-color); width: 100%; max-width: 450px; box-sizing: border-box; color: var(--text-main); max-height: 100%; overflow-y: auto; }
        .modal-title { font-size: 20px; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label { font-size: 15px; margin-bottom: 8px; display: block; color: var(--text-sub); }
        .radio-set { display: flex; gap: 20px; margin-top: 6px; flex-wrap: wrap; }
        .radio-set label { font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .char-count { font-size: 12px; color: var(--text-sub); text-align: right; margin-top: 4px; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; }
        .btn-cancel { background-color: #EEE; color: #555; font-size: 15px; padding: 10px 20px; }
        .btn-cancel:hover { background-color: #DDD; }
        .btn-submit { background-color: var(--text-main); color: #FFF; font-size: 15px; padding: 10px 20px; }
        .btn-submit:hover { background-color: #2D1C19; }

        .inbox-list { max-height: 400px; overflow-y: auto; text-align: left; padding-right: 10px; }
        .inbox-list::-webkit-scrollbar { width: 6px; }
        .inbox-list::-webkit-scrollbar-thumb { background-color: #D3C9BC; border-radius: 4px; }
        .inbox-item { padding: 18px 12px; border-bottom: 1px solid #EEE; font-size: 15px; line-height: 1.6; }
        .inbox-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .inbox-meta { color: var(--text-sub); font-size: 14px; margin-top: 10px; background: var(--bg-body); padding: 10px 14px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
        .btn-delete-msg { background: none; border: 1px solid #E5C5C5; color: #A65A5A; font-size: 13px; padding: 5px 10px; border-radius: 4px; cursor: pointer; flex-shrink: 0; }
        .btn-delete-msg:hover { background-color: #FAF0F0; }
        .toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px); background: var(--text-main); color: #FFF; padding: 12px 22px; border-radius: 6px; font-size: 15px; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 2000; max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .system-msg { color: #A65A5A; font-size: 15px; margin-top: 20px; min-height: 20px; }

        @media (max-width: 860px) {
            .container { padding: 25px 20px; }
            .layout-grid { flex-direction: column; gap: 25px; }
            .canvas-section { width: 100%; align-items: center; }
            .canvas-container { width: 100%; max-width: 380px; }
            .btn-save { max-width: 380px; }
            .shop-section { width: 100%; }
            .shop-list { height: auto; min-height: 0; max-height: 65vh; padding-right: 5px; }
        }
        @media (max-width: 480px) {
            input[type="password"] { width: 100%; }
            .btn-login { margin: 10px 0 0; width: 100%; }
            .tab-btn { padding: 10px 14px; }
            .modal-box { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="container" id="login-screen">
        <h1>옷장</h1>
        <div class="login-wrapper">
            <div class="login-desc">비밀번호를 입력해 주세요.</div>
            <input type="password" id="pw-input" placeholder="비밀번호 입력" onkeydown="if (event.key === 'Enter') login()">
            <button class="btn-login" id="btn-login" onclick="login()">접속하기</button>
            <div id="login-msg" class="system-msg"></div>
            <div class="usage-notice">생성된 이미지는 자유롭게 가공·사용해주세요.<br>오류나 과하게 겹쳐지는 부분이 발생할 시 총괄계로 알려주시면 수정 후 전달드립니다.</div>
        </div>
    </div>

    <div class="container" id="main-screen">
        <div class="header-info">
            <span id="user-name-display"></span>
            <div class="account-box">
                <span class="coin-display"><span id="user-coin-display">0</span> C</span>
                <button class="btn-inbox" onclick="openInboxModal()" title="수신함 확인">✉<span class="inbox-badge" id="inbox-badge"></span></button>
            </div>
        </div>

        <div class="layout-grid">
            <div class="canvas-section">
                <div class="canvas-container">
                    <canvas id="charCanvas" width="300" height="400"></canvas>
                    <div id="effect-clip"><img id="effect-overlay" crossorigin="anonymous" alt="" draggable="false"></div>
                </div>
                <button class="btn-save" onclick="saveAsPNG()">이미지 저장</button>
            </div>

            <div class="shop-section">
                <div class="tab-menu">
                    <button class="tab-btn active" id="tab-clothes" onclick="switchTab('clothes')">의상</button>
                    <button class="tab-btn" id="tab-face" onclick="switchTab('face')">표정</button>
                    <button class="tab-btn" id="tab-bg" onclick="switchTab('bg')">배경</button>
                </div>
                <div class="shop-list" id="shop-list"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="gift-modal">
        <div class="modal-box">
            <div class="modal-title" id="gift-modal-title">의상 선물하기</div>
            <div class="form-group"><label class="form-label" for="gift-recipient">수령인 캐릭터 이름</label><input type="text" id="gift-recipient" style="width:100%;" placeholder="이름을 정확히 입력하세요"></div>
            <div class="form-group">
                <label class="form-label">발송인 표기 방식</label>
                <div class="radio-set"><label><input type="radio" name="gift-sender-vis" value="공개" checked> 발송인 공개</label><label><input type="radio" name="gift-sender-vis" value="익명"> 익명</label></div>
            </div>
            <div class="form-group">
                <label class="form-label">메시지 동봉 여부</label>
                <div class="radio-set"><label><input type="radio" name="gift-msg-toggle" value="없음" checked onchange="toggleMessageField(false)"> 메시지 없음</label><label><input type="radio" name="gift-msg-toggle" value="작성" onchange="toggleMessageField(true)"> 메시지 작성</label></div>
            </div>
            <div class="form-group">
                <textarea id="gift-message" style="width:100%; height:80px; resize:none;" placeholder="전할 문구를 작성하세요" maxlength="200" disabled oninput="updateCharCount()"></textarea>
                <div class="char-count"><span id="gift-char-count">0</span> / 200</div>
            </div>
            <div class="modal-actions"><button class="btn-cancel" onclick="closeGiftModal()">취소</button><button class="btn-submit" onclick="submitGift()">선물 발송</button></div>
        </div>
    </div>

    <div class="modal-overlay" id="inbox-modal">
        <div class="modal-box"><div class="modal-title">받은 선물 및 메시지</div><div class="inbox-list" id="inbox-list-area"></div><div class="modal-actions"><button class="btn-cancel" onclick="closeInboxModal()">닫기</button></div></div>
    </div>

    <div class="toast" id="toast"></div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby0UQLXN92qNyLhqr8VgEQcDV7Q_rMcDaNzX9KbDskZu7RRM65TCAT8XPaKBkVhpBb5/exec';
    const MAX_MESSAGE_LENGTH = 200;

    let sessionToken = '';
    let userData = { name: '', coins: 0, owned: [] };
    let shopItems = [], bgItems = [], receivedMessages = [];
    let accessoryMap = {}, customFitMap = {};
    let faceItems = { eyebrow: [], eye: [], mouth: [], effect: [] };

    let currentClothes = 'default', currentBg = '', currentEyebrow = '', currentEye = '', currentMouth = '', currentEffect = '';
    let currentTab = 'clothes', selectedGiftItemId = '';
    let charAssets = { defaultClothes: '', body: '', frontHair: '', backHair: '', defaultEyebrow: '', defaultEye: '', defaultMouth: '', defaultEyebrowId: '', defaultEyeId: '', defaultMouthId: '' };

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fallbackSrc(label) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#F4EFE6"/><text x="50" y="55" font-size="14" text-anchor="middle" fill="#3E2723" font-family="sans-serif">${esc(label)}</text></svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    let busy = false;
    async function withBusy(fn) {
        if (busy) return;
        localVersion++;
        busy = true; document.body.classList.add('busy');
        try { await fn(); } finally { busy = false; document.body.classList.remove('busy'); }
    }

    async function api(payload) {
        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ ...payload, token: sessionToken }) });
        const data = await res.json();
        if (data.sessionExpired) { alert(data.message); logout(); return null; }
        return data;
    }

    function logout() {
        sessionToken = '';
        stopSync();
        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'block';
        document.getElementById('pw-input').value = '';
        document.getElementById('login-msg').innerText = '';
        closeGiftModal(); closeInboxModal();
    }

    let loggingIn = false;
    async function login() {
        if (loggingIn) return;
        const pw = document.getElementById('pw-input').value;
        const msg = document.getElementById('login-msg');
        if (!pw) { msg.innerText = '비밀번호를 입력해 주세요.'; return; }
        loggingIn = true; document.getElementById('btn-login').disabled = true;
        msg.innerText = '데이터를 확인하고 있습니다...';
        try {
            const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'login', password: pw }) });
            const data = await response.json();
            if (!data.success) { msg.innerText = data.message || '로그인에 실패했습니다.'; return; }

            sessionToken = data.token;
            userData = { name: data.name, coins: data.coins, owned: data.owned || [] };
            shopItems = data.shopItems || []; bgItems = data.bgItems || [];
            charAssets = data.charAssets || charAssets;
            receivedMessages = data.receivedMessages || [];
            accessoryMap = data.accessoryMap || {}; customFitMap = data.customFitMap || {};
            faceItems = Object.assign({ eyebrow: [], eye: [], mouth: [], effect: [] }, data.faceItems || {});

            currentClothes = 'default'; currentBg = ''; currentEffect = '';
            currentEyebrow = charAssets.defaultEyebrowId || '';
            currentEye = charAssets.defaultEyeId || '';
            currentMouth = charAssets.defaultMouthId || '';
            effectClip.style.display = 'none';

            if (!userData.owned.includes('default')) userData.owned.push('default');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            msg.innerText = '';
            updateUI(); updateInboxBadge(); renderCanvas(); startSync();
        } catch (error) {
            msg.innerText = '서버 연동에 실패했습니다.';
        } finally {
            loggingIn = false; document.getElementById('btn-login').disabled = false;
        }
    }

    function switchTab(tabName) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');
        updateUI();
    }

    function previewHtml(src, label) {
        return src
            ? `<img src="${esc(src)}" class="item-preview" alt="" data-label="${esc(label)}">`
            : `<img src="${fallbackSrc(label)}" class="item-preview" alt="">`;
    }
    function actBtn(cls, act, id, text) {
        return `<button class="${cls}" data-act="${act}" data-id="${esc(id)}">${esc(text)}</button>`;
    }
    function card(preview, name, actions) {
        return `<div class="item-card">${preview}<div class="item-name" title="${esc(name)}">${esc(name)}</div><div class="card-actions">${actions}</div></div>`;
    }
    function partCard(item, currentId, act) {
        return card(previewHtml(item.img, '파츠'), item.name, actBtn('btn-equip', act, item.id, currentId === item.id ? '적용 중' : '적용하기'));
    }
    function noneCard(currentId, act, label) {
        return card('<div class="item-preview preview-none">X</div>', label, actBtn('btn-equip', act, '', currentId === '' ? '적용 중' : '적용하기'));
    }

    function updateUI() {
        document.getElementById('user-name-display').innerText = `${userData.name} 님의 옷장`;
        document.getElementById('user-coin-display').innerText = Number(userData.coins || 0).toLocaleString();
        let html = '';

        if (currentTab === 'clothes') {
            html += card(previewHtml(charAssets.defaultClothes, '기본옷'), '기본 의상',
                actBtn('btn-equip', 'equip', 'default', currentClothes === 'default' ? '착용 중' : '착용하기'));
            html += shopItems.map(item => {
                const isOwned = userData.owned.includes(item.id);
                const main = isOwned
                    ? actBtn('btn-equip', 'equip', item.id, currentClothes === item.id ? '착용 중' : '착용하기')
                    : actBtn('btn-buy', 'buy', item.id, `${Number(item.price).toLocaleString()} C`);
                const gift = `<button class="btn-gift-trigger" data-act="gift" data-id="${esc(item.id)}" title="선물하기">🎁</button>`;
                return card(previewHtml(item.img, '의상'), item.name, main + gift);
            }).join('');
        }
        else if (currentTab === 'face') {
            html += '<div class="section-divider">◇ 이펙트 (드래그 가능) ◇</div>';
            html += noneCard(currentEffect, 'effect', '이펙트 지우기');
            html += faceItems.effect.map(item => partCard(item, currentEffect, 'effect')).join('');
            html += '<div class="section-divider">◇ 눈썹 ◇</div>';
            html += faceItems.eyebrow.map(item => partCard(item, currentEyebrow, 'eyebrow')).join('');
            html += '<div class="section-divider">◇ 눈 ◇</div>';
            html += faceItems.eye.map(item => partCard(item, currentEye, 'eye')).join('');
            html += '<div class="section-divider">◇ 입 ◇</div>';
            html += faceItems.mouth.map(item => partCard(item, currentMouth, 'mouth')).join('');
        }
        else if (currentTab === 'bg') {
            html += noneCard(currentBg, 'bg', '배경 없음');
            html += bgItems.map(item => partCard(item, currentBg, 'bg')).join('');
        }
        document.getElementById('shop-list').innerHTML = html;
    }

    const shopList = document.getElementById('shop-list');
    const cardActions = {
        equip: id => equipItem(id), buy: id => buyItem(id), gift: id => openGiftModal(id),
        effect: id => equipEffect(id), eyebrow: id => equipEyebrow(id), eye: id => equipEye(id),
        mouth: id => equipMouth(id), bg: id => equipBg(id)
    };
    shopList.addEventListener('click', e => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const fn = cardActions[btn.dataset.act];
        if (fn) fn(btn.dataset.id || '');
    });
    shopList.addEventListener('error', e => {
        const img = e.target;
        if (img.tagName !== 'IMG' || img.dataset.fallback) return;
        img.dataset.fallback = '1';
        img.src = fallbackSrc(img.dataset.label || '이미지');
    }, true);

    const overlay = document.getElementById('effect-overlay');
    const effectClip = document.getElementById('effect-clip');
    let isDragging = false, startMouseX, startMouseY, initialLeft, initialTop;

    overlay.addEventListener('dragstart', (e) => e.preventDefault());
    overlay.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isDragging = true; startMouseX = e.clientX; startMouseY = e.clientY;
        initialLeft = overlay.offsetLeft; initialTop = overlay.offsetTop;
        overlay.setPointerCapture(e.pointerId); overlay.style.cursor = 'grabbing';
    });

    function clampEffect(left, top) {
        const w = overlay.offsetWidth, h = overlay.offsetHeight;
        const cw = effectClip.clientWidth, ch = effectClip.clientHeight;
        return {
            left: Math.max(-w / 2, Math.min(left, cw - w / 2)),
            top: Math.max(-h / 2, Math.min(top, ch - h / 2))
        };
    }

    overlay.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const pos = clampEffect(initialLeft + (e.clientX - startMouseX), initialTop + (e.clientY - startMouseY));
        overlay.style.left = pos.left + 'px';
        overlay.style.top = pos.top + 'px';
    });

    function endDrag(e) {
        if (!isDragging) return;
        isDragging = false; rememberEffectPosition();
        try { overlay.releasePointerCapture(e.pointerId); } catch (_) {}
        overlay.style.cursor = 'grab';
    }
    overlay.addEventListener('pointerup', endDrag);
    overlay.addEventListener('pointercancel', endDrag);

    const loadImage = (src) => {
        return new Promise((resolve) => {
            if (!src) return resolve(null);
            const img = new Image(); img.crossOrigin = 'anonymous'; img.onload = () => resolve(img);
            img.onerror = () => {
                const proxyImg = new Image(); proxyImg.crossOrigin = 'anonymous';
                proxyImg.onload = () => resolve(proxyImg); proxyImg.onerror = () => resolve(null);
                proxyImg.src = 'https://corsproxy.io/?' + encodeURIComponent(src);
            };
            img.src = src;
        });
    };

    function getCanvasRect() {
        const c = document.getElementById('charCanvas');
        return { left: c.offsetLeft + c.clientLeft, top: c.offsetTop + c.clientTop, width: c.clientWidth, height: c.clientHeight };
    }

    let effectNatural = { w: 0, h: 0 };
    let effectRel = { x: 0.5, y: 0.5 };

    function fitEffectToCanvas(keepPosition) {
        if (!effectNatural.w || !effectNatural.h) return;
        const r = getCanvasRect();
        if (!r.width || !r.height) return;
        effectClip.style.left = r.left + 'px'; effectClip.style.top = r.top + 'px';
        effectClip.style.width = r.width + 'px'; effectClip.style.height = r.height + 'px';

        const scale = Math.min(r.width / effectNatural.w, r.height / effectNatural.h, 1);
        const w = Math.round(effectNatural.w * scale), h = Math.round(effectNatural.h * scale);
        overlay.style.width = w + 'px';
        overlay.style.height = h + 'px';

        const rx = keepPosition ? effectRel.x : 0.5, ry = keepPosition ? effectRel.y : 0.5;
        const pos = clampEffect(r.width * rx - w / 2, r.height * ry - h / 2);
        overlay.style.left = pos.left + 'px';
        overlay.style.top = pos.top + 'px';
        if (!keepPosition) rememberEffectPosition();
    }

    function rememberEffectPosition() {
        const cw = effectClip.clientWidth, ch = effectClip.clientHeight;
        if (!cw || !ch) return;
        effectRel.x = (overlay.offsetLeft + overlay.offsetWidth / 2) / cw;
        effectRel.y = (overlay.offsetTop + overlay.offsetHeight / 2) / ch;
    }

    window.addEventListener('resize', () => {
        if (currentEffect !== '' && effectClip.style.display !== 'none') fitEffectToCanvas(true);
    });

    async function equipEffect(id) {
        currentEffect = id; updateUI();
        if (id === '') { effectClip.style.display = 'none'; return; }
        const item = faceItems.effect.find(i => i.id === id);
        if (!item) return;
        const img = await loadImage(item.img);
        if (currentEffect !== id) return;
        if (!img) { alert('이펙트 이미지를 불러오지 못했습니다.'); return; }
        effectNatural = { w: img.naturalWidth || img.width, h: img.naturalHeight || img.height };
        overlay.src = img.src;
        effectClip.style.display = 'block';
        fitEffectToCanvas(false);
    }

    async function buyItem(itemId) {
        if (busy) return;
        const item = shopItems.find(i => i.id === itemId);
        if (!item) return;
        if (userData.coins < item.price) { alert('코인이 부족합니다.'); return; }
        if (!confirm(`[${item.name}] 의상을 구매하시겠습니까?\n차감: ${item.price} C`)) return;
        await withBusy(async () => {
            try {
                const data = await api({ action: 'buy', itemId });
                if (!data) return;
                if (typeof data.coins === 'number') userData.coins = data.coins;
                if (Array.isArray(data.owned)) userData.owned = data.owned;
                if (!data.success) alert(data.message);
                updateUI();
            } catch (error) { alert('구매 중 오류가 발생했습니다.'); }
        });
    }

    function openGiftModal(itemId) {
        const item = shopItems.find(i => i.id === itemId);
        if (!item) return;
        selectedGiftItemId = itemId;
        document.getElementById('gift-modal-title').innerText = `[${item.name}] 선물하기`;
        document.getElementById('gift-recipient').value = '';
        document.querySelector('input[name="gift-sender-vis"][value="공개"]').checked = true;
        document.querySelector('input[name="gift-msg-toggle"][value="없음"]').checked = true;
        toggleMessageField(false);
        document.getElementById('gift-modal').style.display = 'flex';
    }
    function closeGiftModal() { document.getElementById('gift-modal').style.display = 'none'; }
    function toggleMessageField(isActive) {
        const ta = document.getElementById('gift-message');
        ta.disabled = !isActive;
        if (!isActive) ta.value = '';
        updateCharCount();
    }
    function updateCharCount() {
        document.getElementById('gift-char-count').innerText = document.getElementById('gift-message').value.length;
    }

    async function submitGift() {
        if (busy) return;
        const recipient = document.getElementById('gift-recipient').value.trim();
        if (!recipient || recipient === userData.name) { alert('올바른 캐릭터 이름을 입력하세요.'); return; }
        const item = shopItems.find(i => i.id === selectedGiftItemId);
        if (!item) return;
        if (userData.coins < item.price) { alert('코인이 부족합니다.'); return; }
        const writeMsg = document.querySelector('input[name="gift-msg-toggle"]:checked').value === '작성';
        const messageText = writeMsg ? document.getElementById('gift-message').value.trim().slice(0, MAX_MESSAGE_LENGTH) : '';
        if (!confirm(`[${recipient}] 님에게 [${item.name}]을(를) 선물하시겠습니까? (소모: ${item.price} C)`)) return;

        await withBusy(async () => {
            try {
                const data = await api({
                    action: 'gift', recipientName: recipient, itemId: selectedGiftItemId,
                    senderVisibility: document.querySelector('input[name="gift-sender-vis"]:checked').value,
                    messageText
                });
                if (!data) return;
                if (typeof data.coins === 'number') userData.coins = data.coins;
                if (data.success) { alert('선물 발송 완료'); closeGiftModal(); }
                else alert(data.message);
                updateUI();
            } catch (e) { alert('통신 오류가 발생했습니다.'); }
        });
    }

    function updateInboxBadge() {
        const badge = document.getElementById('inbox-badge');
        badge.innerText = receivedMessages.length;
        badge.style.display = receivedMessages.length ? 'inline-block' : 'none';
    }

    function renderInbox() {
        const area = document.getElementById('inbox-list-area');
        if (receivedMessages.length === 0) {
            area.innerHTML = '<div style="text-align:center; padding: 20px; color:#999;">도착한 선물이나 메시지가 없습니다.</div>';
            return;
        }
        area.innerHTML = receivedMessages.map(m => `
            <div class="inbox-item">
                <div class="inbox-head">
                    <div><b>${esc(m.sender)}</b> 님께서 의상 <b>[${esc(m.itemName)}]</b>을 선물하셨습니다.</div>
                    <button class="btn-delete-msg" data-log-row="${Number(m.logRowIndex)}">삭제</button>
                </div>
                ${m.message && m.message !== '없음' ? `<div class="inbox-meta">${esc(m.message)}</div>` : ''}
            </div>`).join('');
    }

    function openInboxModal() { renderInbox(); document.getElementById('inbox-modal').style.display = 'flex'; syncData(); }
    function closeInboxModal() { document.getElementById('inbox-modal').style.display = 'none'; }

    document.getElementById('inbox-list-area').addEventListener('click', e => {
        const btn = e.target.closest('button[data-log-row]');
        if (btn) deleteMessage(Number(btn.dataset.logRow));
    });

    async function deleteMessage(logRowIndex) {
        if (busy || !confirm('삭제하시겠습니까?')) return;
        await withBusy(async () => {
            try {
                const data = await api({ action: 'deleteMessage', logRowIndex });
                if (!data) return;
                if (!data.success) { alert(data.message); return; }
                receivedMessages = receivedMessages.filter(m => m.logRowIndex !== logRowIndex);
                renderInbox(); updateInboxBadge();
            } catch (e) { alert('삭제 중 오류가 발생했습니다.'); }
        });
    }

    const SYNC_INTERVAL_MS = 20000;
    let syncTimer = null, syncing = false;
    let localVersion = 0;   

    function startSync() {
        stopSync();
        syncTimer = setInterval(syncData, SYNC_INTERVAL_MS);
    }
    function stopSync() {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = null;
    }

    async function syncData() {
        if (!sessionToken || syncing || busy || document.hidden) return;
        syncing = true;
        const startVersion = localVersion;
        try {
            const data = await api({ action: 'sync' });
            if (!data || !data.success || busy || startVersion !== localVersion) return;

            const msgKey = list => list.map(m => m.logRowIndex).join(',');
            const newCount = data.receivedMessages.filter(m => !receivedMessages.some(o => o.logRowIndex === m.logRowIndex)).length;
            const msgChanged = msgKey(data.receivedMessages) !== msgKey(receivedMessages);
            const ownedChanged = data.owned.join(',') !== userData.owned.join(',');
            const coinsChanged = data.coins !== userData.coins;

            if (msgChanged) {
                receivedMessages = data.receivedMessages;
                updateInboxBadge();
                if (document.getElementById('inbox-modal').style.display === 'flex') renderInbox();
            }
            if (ownedChanged || coinsChanged) {
                userData.coins = data.coins;
                userData.owned = data.owned.includes('default') ? data.owned : [...data.owned, 'default'];
                updateUI();
            }
            if (newCount > 0) showToast(`새 선물이 ${newCount}개 도착했습니다. ✉`);
        } catch (e) {
        } finally {
            syncing = false;
        }
    }

    document.addEventListener('visibilitychange', () => { if (!document.hidden) syncData(); });

    function showToast(text) {
        const t = document.getElementById('toast');
        t.innerText = text;
        t.classList.add('show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => t.classList.remove('show'), 4000);
    }

    function equipItem(id) { currentClothes = id; updateUI(); renderCanvas(); }
    function equipBg(id) { currentBg = id; updateUI(); renderCanvas(); }
    function equipEyebrow(id) { currentEyebrow = id; updateUI(); renderCanvas(); }
    function equipEye(id) { currentEye = id; updateUI(); renderCanvas(); }
    function equipMouth(id) { currentMouth = id; updateUI(); renderCanvas(); }

    let renderSeq = 0;  

    async function renderCanvas() {
        const mySeq = ++renderSeq;
        const canvas = document.getElementById('charCanvas'); const ctx = canvas.getContext('2d');

        let clothesSrc = '';
        let partsToHide = [];
        let bodySrcToLoad = charAssets.body;
        let isCustomBody = false;

        if (currentClothes === 'default') {
            const fit = customFitMap['default'];
            clothesSrc = (fit && fit.outfitImg) || charAssets.defaultClothes;
            if (fit && fit.bodyImg) { bodySrcToLoad = fit.bodyImg; isCustomBody = true; }
        } else {
            const currentItem = shopItems.find(i => i.id === currentClothes);
            if (currentItem) {
                if (currentItem.hideParts) partsToHide = currentItem.hideParts;
                clothesSrc = currentItem.img;
                if (currentItem.altBody) { bodySrcToLoad = currentItem.altBody; isCustomBody = true; }
                const fit = customFitMap[currentClothes];
                if (fit) {
                    if (fit.outfitImg) clothesSrc = fit.outfitImg;
                    if (fit.bodyImg) { bodySrcToLoad = fit.bodyImg; isCustomBody = true; }
                }
            }
        }

        const bgSrc = bgItems.find(i => i.id === currentBg)?.img || '';
        const accSrc = accessoryMap[currentClothes] || '';
        const pick = (list, id, fallback) => list.find(i => i.id === id)?.img || (id.startsWith('http') ? id : fallback);
        const eyebrowSrc = pick(faceItems.eyebrow, currentEyebrow, charAssets.defaultEyebrow);
        const eyeSrc = pick(faceItems.eye, currentEye, charAssets.defaultEye);
        const mouthSrc = pick(faceItems.mouth, currentMouth, charAssets.defaultMouth);

        const [imgBg, imgBack, imgBody, imgEye, imgMouth, imgEyebrow, imgClothes, imgFront, imgAcc] = await Promise.all([
            loadImage(bgSrc), loadImage(charAssets.backHair), loadImage(bodySrcToLoad), loadImage(eyeSrc), loadImage(mouthSrc),
            loadImage(eyebrowSrc), loadImage(clothesSrc), loadImage(charAssets.frontHair), loadImage(accSrc)
        ]);

        if (mySeq !== renderSeq) return;   // 더 최신 렌더 요청이 있으면 이번 결과는 버림

        const baseImg = imgBody || imgBack || imgFront || imgClothes;
        if (baseImg) { canvas.width = baseImg.width; canvas.height = baseImg.height; } else { canvas.width = 300; canvas.height = 400; }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const draw = img => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        if (imgBg) draw(imgBg);
        if (imgBack && !partsToHide.includes('뒷머리')) draw(imgBack);
        if (imgBody && (!partsToHide.includes('몸') || isCustomBody)) draw(imgBody);
        if (imgEye && !partsToHide.includes('눈')) draw(imgEye);
        if (imgMouth && !partsToHide.includes('입')) draw(imgMouth);
        if (imgEyebrow && !partsToHide.includes('눈썹')) draw(imgEyebrow);
        if (imgClothes) draw(imgClothes);
        if (imgFront && !partsToHide.includes('앞머리')) draw(imgFront);
        if (imgAcc && !partsToHide.includes('악세사리')) draw(imgAcc);

        if (currentEffect !== '' && effectClip.style.display !== 'none') fitEffectToCanvas(true);
    }

    function saveAsPNG() {
        const canvas = document.getElementById('charCanvas');
        const out = document.createElement('canvas');
        out.width = canvas.width; out.height = canvas.height;
        const ctx = out.getContext('2d');
        ctx.drawImage(canvas, 0, 0);

        if (currentEffect !== '' && effectClip.style.display !== 'none') {
            const r = getCanvasRect();
            const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
            ctx.drawImage(overlay, overlay.offsetLeft * scaleX, overlay.offsetTop * scaleY, overlay.offsetWidth * scaleX, overlay.offsetHeight * scaleY);
        }

        let url;
        try { url = out.toDataURL('image/png'); }
        catch (e) { alert('일부 이미지의 외부 접근이 막혀 있어 저장할 수 없습니다. 총괄계로 알려주세요.'); return; }

        const link = document.createElement('a');
        link.download = `${userData.name}_코디.png`; link.href = url;
        document.body.appendChild(link); link.click(); link.remove();
    }
</script>
